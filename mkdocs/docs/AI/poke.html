Object.assign(Poker, {
  SUITS, SUIT_NAMES, SUIT_SYMBOLS, RANK_NAMES, RED_SUITS, BLACK_SUITS,
  HAND_NAMES, PHASES, SB_AMOUNT, BB_AMOUNT,
  get STARTING_CHIPS() { return STARTING_CHIPS; },
  get currentLang() { return currentLang; },
  I18N, HAND_NAME_KEYS, PHASE_KEYS,
  t, getHandName, applyI18n, setLang,
  createCard, cardIsRed, buildDeck, secureRandomInt, shuffleDeck,
  getCombinations, evaluate5Hand, evaluate7Hand, compareResults
});

// ── Player ──
class Player {
  constructor(name, isHuman, seatIndex) {
    this.name = name;
    this.isHuman = isHuman;
    this.seatIndex = seatIndex;
    this.chips = STARTING_CHIPS;
    this.holeCards = [];
    this.folded = false;
    this.allIn = false;
    this.roundBet = 0;
    this.totalBetThisHand = 0;
    this.hasActedThisRound = false;
  }

  resetForNewHand() {
    this.holeCards = [];
    this.folded = false;
    this.allIn = false;
    this.roundBet = 0;
    this.totalBetThisHand = 0;
    this.hasActedThisRound = false;
  }

  isActive() { return !this.folded && !this.allIn && this.chips > 0; }

  contribute(amount) {
    const actual = Math.min(amount, this.chips);
    this.chips -= actual;
    this.roundBet += actual;
    this.totalBetThisHand += actual;
    if (this.chips === 0) this.allIn = true;
    return actual;
  }
}

// ── Poker Game ──
class PokerGame {
  constructor() {
    this.players = [];
    this.deck = [];
    this.communityCards = [];
    this.pot = 0;
    this.currentBet = 0;
    this.dealerIdx = 0;
    this.currentPlayerIdx = 0;
    this.phase = 'IDLE';
    this.handNumber = 0;
    this.lastRaiseAmount = BB_AMOUNT;
    this.canReRaise = true;
    this.lastAggressorIdx = -1;
    this.actionResolver = null;
    this.sidePots = [];
    this.busy = false;
    this.els = {};
    this.cacheDOM();
  }

  cacheDOM() {
    const $ = (id) => document.getElementById(id);
    this.els = {
      controls: $('controls'),
      phaseBadge: $('phase-badge'),
      handCounter: $('hand-counter'),
      communityCards: $('community-cards'),
      potAmount: $('pot-amount'),
      seatsContainer: $('seats-container'),
      tableArea: $('table-area'),
      yourHandDisplay: $('your-hand-display'),
      btnFold: $('btn-fold'),
      btnCheck: $('btn-check'),
      btnCall: $('btn-call'),
      btnFoldCallRow: $('btn-fold-call-row'),
      btnRaise: $('btn-raise'),
      btnAllin: $('btn-allin'),
      raiseSlider: $('raise-slider'),
      raiseAmount: $('raise-amount'),
      resultBanner: $('result-banner'),
      resultTitle: $('result-title'),
      resultCards: $('result-cards'),
      resultPlayers: $('result-players'),
      setupOverlay: $('setup-overlay'),
      gameLog: $('game-log'),
      playerNameInput: $('player-name-input'),
      chipsSelect: $('chips-select'),
      startBtn: $('start-btn'),
      logEntries: $('log-entries'),
      btnNextHand: $('btn-next-hand'),
      resultWinner: $('result-winner'),
      resultHand: $('result-hand'),
      resultPot: $('result-pot')
    };
    // Button handlers — bind once, compute state dynamically at click time
    this.els.btnFold.onclick = () => {
      const human = this.players[0];
      if (human) this.resolveAction(human, 'fold', 0);
    };
    this.els.btnCheck.onclick = () => {
      const human = this.players[0];
      if (human) this.resolveAction(human, 'check', 0);
    };
    this.els.btnCall.onclick = () => {
      const human = this.players[0];
      if (!human) return;
      const toCall = this.currentBet - human.roundBet;
      const callAmt = Math.min(toCall, human.chips);
      this.resolveAction(human, callAmt >= human.chips ? 'allin' : 'call', callAmt);
    };
    this.els.btnRaise.onclick = () => {
      const human = this.players[0];
      if (!human) return;
      const raiseTo = parseInt(this.els.raiseSlider.value);
      const increment = raiseTo - human.roundBet;
      this.resolveAction(human, increment >= human.chips ? 'allin' : 'raise', raiseTo);
    };
    this.els.btnAllin.onclick = () => {
      const human = this.players[0];
      if (human) this.resolveAction(human, 'allin', human.chips);
    };
    this.els.raiseSlider.oninput = () => {
      const total = parseInt(this.els.raiseSlider.value);
      const raiseSize = total - this.currentBet;
      this.els.raiseAmount.textContent = `+$${raiseSize} → $${total}`;
    };
  }

  initPlayers(count, humanName) {
    this.players = [];
    this.players.push(new Player(humanName || 'You', true, 0));
    const aiNames = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot', 'Golf', 'Hotel'];
    for (let i = 1; i < count; i++) {
      this.players.push(new Player(aiNames[i - 1], false, i));
    }
    this.dealerIdx = 0;
    this.handNumber = 0;
  }

  startNewHand() {
    this.handNumber++;
    this.phase = 'PRE_FLOP';
    this.communityCards = [];
    this.pot = 0;
    this.currentBet = 0;
    this.sidePots = [];
    this.lastAggressorIdx = -1;

    // Reset players
    this.players.forEach(p => p.resetForNewHand());

    // Remove busted players (chips === 0 = out of the game)
    const busted = this.players.filter(p => p.chips === 0);
    if (busted.length > 0) {
      this.addLog(busted.map(p => p.name).join(', ') + ' 已出局', 'action-fold');
      const oldDealerIdx = this.dealerIdx;
      const oldDealer = this.players[oldDealerIdx];
      this.players = this.players.filter(p => p.chips > 0);
      const newIdx = this.players.indexOf(oldDealer);
      this.dealerIdx = newIdx >= 0 ? newIdx : Math.min(oldDealerIdx, this.players.length - 1);
    }

    // Rotate dealer
    if (this.handNumber > 1) {
      this.dealerIdx = (this.dealerIdx + 1) % this.players.length;
    }

    // Build and shuffle deck
    this.deck = shuffleDeck(buildDeck());

    // Deal hole cards
    for (const player of this.players) {
      player.holeCards = [this.deck.pop(), this.deck.pop()];
    }

    // Post blinds
    this.postBlinds();
  }

  postBlinds() {
    const livePlayers = this.players.filter(p => p.chips > 0);
    if (livePlayers.length < 2) return;

    let sbIdx, bbIdx;

    if (this.players.length === 2) {
      // Heads-up: dealer IS the small blind
      sbIdx = this.dealerIdx;
      bbIdx = this.nextActiveSeat(sbIdx);
    } else {
      sbIdx = this.nextActiveSeat(this.dealerIdx);
      bbIdx = this.nextActiveSeat(sbIdx);
    }

    // Small blind
    const sbPlayer = this.players[sbIdx];
    const sbActual = sbPlayer.contribute(Math.min(SB_AMOUNT, sbPlayer.chips));
    this.pot += sbActual;

    // Big blind
    const bbPlayer = this.players[bbIdx];
    const bbActual = bbPlayer.contribute(Math.min(BB_AMOUNT, bbPlayer.chips));
    this.pot += bbActual;

    this.currentBet = BB_AMOUNT;
    this.lastRaiseAmount = BB_AMOUNT;
    this.canReRaise = true;

    // First to act pre-flop
    if (this.players.length === 2) {
      // Heads-up: dealer/SB acts first pre-flop
      this.currentPlayerIdx = this.dealerIdx;
    } else {
      // UTG (left of BB) acts first
      this.currentPlayerIdx = this.nextActiveSeat(bbIdx);
    }
  }

  dealCommunity(count) {
    // Burn a card (pop and discard)
    this.deck.pop();
    for (let i = 0; i < count; i++) {
      this.communityCards.push(this.deck.pop());
    }
  }

  getFirstToActPostFlop() {
    // First active player left of dealer
    return this.nextActiveSeat(this.dealerIdx);
  }

  nextActiveSeat(fromIdx) {
    if (this.players.length === 0) return 0;
    let idx = (fromIdx + 1) % this.players.length;
    let safety = 0;
    while ((this.players[idx].chips === 0 || this.players[idx].folded) && safety < this.players.length * 2) {
      idx = (idx + 1) % this.players.length;
      safety++;
    }
    return idx;
  }

  countActivePlayers() {
    return this.players.filter(p => !p.folded && p.chips > 0).length;
  }

  countPlayersInHand() {
    return this.players.filter(p => !p.folded).length;
  }

  // ── Betting Round ──
  async runBettingRound() {
    // Do NOT reset roundBets here — for pre-flop, blinds are already posted.
    // For post-flop rounds, the end of the previous round already did the reset.

    // If only 1 player left, skip
    if (this.countPlayersInHand() <= 1) return;

    let safety = 0;
    const maxIterations = this.players.length * 10;

    while (safety < maxIterations) {
      safety++;

      // If only 1 player remains
      if (this.countPlayersInHand() <= 1) break;

      // Check if round is complete
      if (this.isBettingRoundComplete()) break;

      const player = this.players[this.currentPlayerIdx];

      // Skip inactive players
      if (player.folded || player.allIn || player.chips === 0) {
        this.currentPlayerIdx = (this.currentPlayerIdx + 1) % this.players.length;
        continue;
      }

      const toCall = this.currentBet - player.roundBet;

      // Player has matched and already acted
      if (toCall === 0 && player.hasActedThisRound) {
        this.currentPlayerIdx = (this.currentPlayerIdx + 1) % this.players.length;
        continue;
      }

      // Player must act
      // Render BEFORE waiting to ensure controls reflect current player
      this.render();

      let action;
      if (player.isHuman) {
        action = await this.waitForHumanAction(player);
      } else {
        await this.delay(400 + Math.random() * 700);
        action = this.getAIAction(player);
      }
      this.executeAction(player, action);

      this.currentPlayerIdx = (this.currentPlayerIdx + 1) % this.players.length;
    }

    // Collect round bets into pot (they're already contributed, but let's ensure)
    // Reset round state for next betting round
    this.players.forEach(p => { p.roundBet = 0; p.hasActedThisRound = false; });
    this.currentBet = 0;
  }

  isBettingRoundComplete() {
    let allMatched = true;
    let someoneNeedsToAct = false;
    for (const p of this.players) {
      if (p.folded || p.allIn || p.chips === 0) continue;
      const toCall = this.currentBet - p.roundBet;
      if (toCall !== 0) {
        allMatched = false;
        break;
      }
      if (!p.hasActedThisRound) {
        someoneNeedsToAct = true;
      }
    }
    return allMatched && !someoneNeedsToAct;
  }

  executeAction(player, action) {
    player.hasActedThisRound = true;
    const actionType = action.action;
    let amount = action.amount || 0;

    switch (actionType) {
      case 'fold':
        player.folded = true;
        this.addLog(t('log.fold', player.name), 'action-fold');
        break;
      case 'check':
        this.addLog(t('log.check', player.name));
        break;
      case 'call':
        amount = Math.min(this.currentBet - player.roundBet, player.chips);
        this.pot += player.contribute(amount);
        if (player.allIn) {
          this.addLog(t('log.callAllIn', player.name, amount), 'action-allin');
        } else {
          this.addLog(t('log.call', player.name, amount));
        }
        break;
      case 'raise':
      case 'bet': {
          // amount is the TOTAL bet for this round, calculate increment
          const increment = amount - player.roundBet;
          if (increment <= 0) {
            // Player attempted a raise to an amount <= current bet — treat as check
            const toCheckAmt = this.currentBet - player.roundBet;
            if (toCheckAmt > 0) {
              // Under normal flow, this shouldn't happen; log the mismatch
              this.addLog(player.name + ': invalid raise (amount <= current bet), treating as check', 'action-fold');
            }
            this.addLog(t('log.check', player.name));
          } else {
            const minTotal = this.currentBet + Math.max(BB_AMOUNT, this.lastRaiseAmount);
            const allInTotal = player.roundBet + player.chips;

            if (increment >= player.chips && allInTotal >= minTotal) {
              // Valid all-in raise
              const allInAmt = player.chips;
              const rOldCB = this.currentBet;
              const rOldLR = this.lastRaiseAmount;
              this.pot += player.contribute(allInAmt);
              this.currentBet = allInTotal;
              const raiseSize = allInTotal - rOldCB;
              if (raiseSize >= rOldLR) {
                this.lastRaiseAmount = Math.max(raiseSize, BB_AMOUNT);
                this.canReRaise = true;
              } else {
                this.canReRaise = false;
              }
              this.lastAggressorIdx = player.seatIndex;
              this.addLog(`${player.name} ALL-IN $${allInAmt}`, 'action-allin');
            } else if (increment >= player.chips && allInTotal < minTotal) {
              // All-in raise too small — treat as call
              const callAmt = Math.min(this.currentBet - player.roundBet, player.chips);
              this.pot += player.contribute(callAmt);
              if (player.allIn) {
                this.addLog(t('log.callAllIn', player.name, callAmt), 'action-allin');
              } else {
                this.addLog(t('log.call', player.name, callAmt));
              }
              this.addLog(player.name + ': all-in too small to raise, treated as call', 'action-fold');
            } else if (amount < minTotal) {
              // Under-raise not allowed — treat as call
              const callAmt = Math.min(this.currentBet - player.roundBet, player.chips);
              this.pot += player.contribute(callAmt);
              if (player.allIn) {
                this.addLog(t('log.callAllIn', player.name, callAmt), 'action-allin');
              } else {
                this.addLog(t('log.call', player.name, callAmt));
              }
              this.addLog(player.name + ': raise too small, treated as call', 'action-fold');
            } else {
              const oldCurrentBet = this.currentBet;
              this.pot += player.contribute(increment);
              this.currentBet = player.roundBet;
              this.lastRaiseAmount = Math.max(player.roundBet - oldCurrentBet, BB_AMOUNT);
              this.canReRaise = true;
              this.lastAggressorIdx = player.seatIndex;
              this.addLog(t('log.raiseTo', player.name, player.roundBet), 'action-raise');
            }
          }
          break;
        }
      case 'allin':
        amount = player.chips;
        const aOldCB = this.currentBet;
        const aOldLR = this.lastRaiseAmount;
        this.pot += player.contribute(amount);
        this.currentBet = Math.max(this.currentBet, player.roundBet);
        if (player.roundBet > aOldCB) {
          const raiseSize = player.roundBet - aOldCB;
          if (raiseSize >= aOldLR) {
            this.lastRaiseAmount = Math.max(raiseSize, BB_AMOUNT);
            this.canReRaise = true;
          } else {
            this.canReRaise = false;
          }
        }
        this.lastAggressorIdx = player.seatIndex;
        this.addLog(`${player.name} ALL-IN $${amount}`, 'action-allin');
        break;
    }
  }

  waitForHumanAction(player) {
    return new Promise(resolve => {
      this.actionResolver = resolve;
    });
  }

  resolveAction(player, action, amount) {
    if (this.actionResolver) {
      this.actionResolver({ action, amount });
      this.actionResolver = null;
    }
  }

  // ═══════════════════════════════════════════
  // Quantitative AI System
  // ═══════════════════════════════════════════

  // Chen formula: mathematical pre-flop hand valuation (Bill Chen, "Mathematics of Poker")
  chenScore(hole) {
    const rankVal = { 14:10, 13:8, 12:7, 11:6, 10:5, 9:4.5, 8:4, 7:3.5, 6:3, 5:2.5, 4:2, 3:1.5, 2:1 };
    const high = Math.max(hole[0].rank, hole[1].rank);
    const low = Math.min(hole[0].rank, hole[1].rank);
    const gap = high - low;
    const suited = hole[0].suit === hole[1].suit;

    let score = rankVal[high];

    // Pocket pair: double, floor 5
    if (gap === 0) score = Math.max(score * 2, 5);

    // Suited bonus: +2
    if (suited) score += 2;

    // Gap penalty: wider gap = less straight potential
    const gapPen = [0, 0, 1, 2, 4, 5, 5, 5, 5, 5, 5, 5, 5];
    score -= gapPen[Math.min(gap, 12)];

    // Connected bonus: +1 for 0 or 1 gap
    if (gap <= 1) score += 1;

    return score; // Range: ~ -2 (72o) to 20 (AA)
  }

  // Convert Chen score → equity vs N opponents (logistic model)
  preFlopEquity(hole, numOpp) {
    const chen = this.chenScore(hole);
    // Logistic: percentile rank among 1326 starting hands
    const percentile = 1 / (1 + Math.exp(-0.42 * (chen - 4.5)));
    // Equity decays with opponents: p ^ exponent
    const equity = Math.pow(percentile, 0.70 + 0.30 * numOpp);
    return Math.min(0.95, Math.max(0.06, equity));
  }

  // Monte Carlo simulation for post-flop equity
  monteCarloEquity(hole, community, numOpp, trials) {
    if (trials === undefined) trials = Math.min(150, 40 + numOpp * 30);

    // Pool = all cards NOT in hero's hole or community (AI's uncertain cards)
    const known = new Set([...hole, ...community].map(c => c.suit + '|' + c.rank));
    const pool = [];
    for (const suit of SUITS) {
      for (let rank = 2; rank <= 14; rank++) {
        if (!known.has(suit + '|' + rank)) pool.push(createCard(suit, rank));
      }
    }

    const needed = 5 - community.length;
    let wins = 0;

    for (let t = 0; t < trials; t++) {
      // Fisher-Yates shuffle in-place (CSPRNG)
      for (let i = pool.length - 1; i > 0; i--) {
        const j = secureRandomInt(i + 1);
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      let idx = 0;
      const oppHands = [];
      for (let o = 0; o < numOpp; o++) oppHands.push([pool[idx++], pool[idx++]]);

      const extraComm = [];
      for (let c = 0; c < needed; c++) extraComm.push(pool[idx++]);
      const fullComm = [...community, ...extraComm];

      const heroHand = evaluate7Hand([...hole, ...fullComm]);

      let heroWins = true;
      for (const opp of oppHands) {
        if (compareResults(evaluate7Hand([...opp, ...fullComm]), heroHand) > 0) {
          heroWins = false;
          break;
        }
      }
      if (heroWins) wins++;
    }

    return wins / trials;
  }

  // Build pool of unknown cards (not in hero's hole or community)
  buildUnknownPool(hole, community) {
    const known = new Set([...hole, ...community].map(c => c.suit + '|' + c.rank));
    const pool = [];
    for (const suit of SUITS) {
      for (let rank = 2; rank <= 14; rank++) {
        if (!known.has(suit + '|' + rank)) pool.push(createCard(suit, rank));
      }
    }
    return pool;
  }

  // Exact enumeration: river (5 community) vs 1 opponent
  // Enumerate all C(45,2)=990 opponent hands exactly
  enumerateRiver(hole, community) {
    const pool = this.buildUnknownPool(hole, community);
    const heroBest = evaluate7Hand([...hole, ...community]);
    let wins = 0, ties = 0;
    const n = pool.length;
    for (let i = 0; i < n - 1; i++) {
      for (let j = i + 1; j < n; j++) {
        const oppBest = evaluate7Hand([pool[i], pool[j], ...community]);
        const cmp = compareResults(heroBest, oppBest);
        if (cmp > 0) wins++;
        else if (cmp === 0) ties++;
      }
    }
    const total = n * (n - 1) / 2;
    return (wins + ties / 2) / total;
  }

  // Hybrid: turn (4 community) vs 1 opponent
  // Enumerate all 46 river cards, sample ~100 opponent hands each
  enumerateTurn(hole, community) {
    const pool = this.buildUnknownPool(hole, community);
    const samplesPerRiver = 100;
    let totalWins = 0, totalTies = 0, totalSamples = 0;

    for (let r = 0; r < pool.length; r++) {
      const riverCard = pool[r];
      const fullComm = [...community, riverCard];
      const heroBest = evaluate7Hand([...hole, ...fullComm]);

      const subPool = [];
      for (let k = 0; k < pool.length; k++) {
        if (k !== r) subPool.push(pool[k]);
      }

      const maxS = Math.min(samplesPerRiver, subPool.length * (subPool.length - 1) / 2);
      for (let s = 0; s < maxS; s++) {
        const a = Math.floor(Math.random() * subPool.length);
        let b = Math.floor(Math.random() * (subPool.length - 1));
        if (b >= a) b++;

        const oppBest = evaluate7Hand([subPool[a], subPool[b], ...fullComm]);
        const cmp = compareResults(heroBest, oppBest);
        if (cmp > 0) totalWins++;
        else if (cmp === 0) totalTies++;
        totalSamples++;
      }
    }
    return totalSamples === 0 ? 0.5 : (totalWins + totalTies / 2) / totalSamples;
  }

  // Hybrid: flop (3 community) vs 1 opponent
  // Enumerate all C(47,2)=1081 turn+river boards, sample ~25 opponent hands each
  enumerateFlop(hole, community) {
    const pool = this.buildUnknownPool(hole, community);
    const samplesPerBoard = 25;
    let totalWins = 0, totalTies = 0, totalSamples = 0;
    const n = pool.length;

    for (let i = 0; i < n - 1; i++) {
      for (let j = i + 1; j < n; j++) {
        const fullComm = [...community, pool[i], pool[j]];
        const heroBest = evaluate7Hand([...hole, ...fullComm]);

        const subPool = [];
        for (let k = 0; k < n; k++) {
          if (k !== i && k !== j) subPool.push(pool[k]);
        }

        const maxS = Math.min(samplesPerBoard, subPool.length * (subPool.length - 1) / 2);
        for (let s = 0; s < maxS; s++) {
          const a = Math.floor(Math.random() * subPool.length);
          let b = Math.floor(Math.random() * (subPool.length - 1));
          if (b >= a) b++;

          const oppBest = evaluate7Hand([subPool[a], subPool[b], ...fullComm]);
          const cmp = compareResults(heroBest, oppBest);
          if (cmp > 0) totalWins++;
          else if (cmp === 0) totalTies++;
          totalSamples++;
        }
      }
    }
    return totalSamples === 0 ? 0.5 : (totalWins + totalTies / 2) / totalSamples;
  }

  // Unified equity calculator with partition enumeration + Monte Carlo hybrid
  calcEquity(player, numOpp) {
    if (this.communityCards.length === 0) {
      return this.preFlopEquity(player.holeCards, numOpp);
    }
    // Single opponent: use partition enumeration (exact or hybrid)
    if (numOpp === 1) {
      if (this.communityCards.length === 5) {
        return this.enumerateRiver(player.holeCards, this.communityCards);
      }
      if (this.communityCards.length === 4) {
        return this.enumerateTurn(player.holeCards, this.communityCards);
      }
      if (this.communityCards.length === 3) {
        return this.enumerateFlop(player.holeCards, this.communityCards);
      }
    }
    // Multi-opponent or pre-flop: Monte Carlo fallback
    return this.monteCarloEquity(player.holeCards, this.communityCards, numOpp);
  }

  // Pot-percentage based raise sizing
  makeRaise(player, potFrac) {
    const increment = Math.floor(this.pot * potFrac);
    const minTotal = this.currentBet + Math.max(BB_AMOUNT, this.lastRaiseAmount);
    let total = player.roundBet + increment;
    total = Math.max(total, minTotal);
    total = Math.floor(Math.min(total, player.chips) / 10) * 10;
    if (total <= player.roundBet && player.chips > 0) {
      // All-in — verify it actually raises the current bet
      const allInTotal = player.roundBet + player.chips;
      if (allInTotal <= this.currentBet) {
        // Cannot raise with all-in; call all-in for less (side pot case)
        return { action: 'call' };
      }
      return { action: 'allin' };
    }
    if (total <= player.roundBet) return { action: 'check' };
    return { action: 'raise', amount: total };
  }

  // ═══════════════════════════════════════════
  // DCFR (Discounted Counterfactual Regret Minimization) Solver
  // Models a 2-player subgame for the current street
  // ═══════════════════════════════════════════

  dcfrGetAction(player, numOpp, canRaise) {
    const toCall = this.currentBet - player.roundBet;
    const pot = this.pot;
    const hole = player.holeCards;
    const community = this.communityCards;
    const effStack = player.chips;

    // ── Define abstract actions for hero ──
    let heroActions;
    if (toCall === 0) {
      heroActions = [
        { name: 'check', type: 'passive', amt: 0 },
        { name: 'bet33', type: 'aggressive', mult: 0.33 },
        { name: 'bet67', type: 'aggressive', mult: 0.67 },
        { name: 'bet100', type: 'aggressive', mult: 1.0 }
      ];
    } else {
      const callAllIn = toCall >= effStack;
      heroActions = [
        { name: 'fold', type: 'fold', amt: 0 },
        { name: 'call', type: 'passive', amt: toCall }
      ];
      if (!callAllIn && canRaise) {
        heroActions.push({ name: 'raise50', type: 'aggressive', mult: 0.50 });
        heroActions.push({ name: 'raise100', type: 'aggressive', mult: 1.0 });
      }
    }
    const numHA = heroActions.length;

    // ── Opponent response actions (when hero bets/raises) ──
    const oppActions = [
      { name: 'fold', type: 'fold' },
      { name: 'call', type: 'call' },
      { name: 'raise', type: 'raise' }
    ];
    const numOA = oppActions.length;

    // Regret accumulators
    const heroRegrets = new Array(numHA).fill(0);
    const heroStratSum = new Array(numHA).fill(0);
    const oppRegrets = new Array(numOA).fill(0);
    const oppStratSum = new Array(numOA).fill(0);

    // Pool of unknown cards (hero doesn't know opponent's hand)
    const pool = this.buildUnknownPool(hole, community);
    const ITER = 100;

    // Terminal evaluator: estimate equity × pot via Monte Carlo sampling
    const terminalEV = (extraBoard, finalPot, samples) => {
      let wins = 0, ties = 0;
      for (let s = 0; s < samples; s++) {
        const i = Math.floor(Math.random() * pool.length);
        let j = Math.floor(Math.random() * (pool.length - 1));
        if (j >= i) j++;
        const oppHand = [pool[i], pool[j]];
        const hero7 = [...hole, ...community, ...extraBoard];
        const opp7 = [...oppHand, ...community, ...extraBoard];
        const cmp = compareResults(evaluate7Hand(hero7), evaluate7Hand(opp7));
        if (cmp > 0) wins++;
        else if (cmp === 0) ties++;
      }
      return ((wins + ties / 2) / samples) * finalPot;
    };

    // CFR iteration loop
    for (let t = 0; t < ITER; t++) {
      const t1 = t + 1;

      // ── Regret matching for hero strategy ──
      const heroStrat = new Array(numHA);
      let posSum = 0;
      for (let a = 0; a < numHA; a++) {
        heroStrat[a] = Math.max(heroRegrets[a], 0);
        posSum += heroStrat[a];
      }
      if (posSum > 1e-9) {
        for (let a = 0; a < numHA; a++) heroStrat[a] /= posSum;
      } else {
        for (let a = 0; a < numHA; a++) heroStrat[a] = 1 / numHA;
      }
      for (let a = 0; a < numHA; a++) heroStratSum[a] += heroStrat[a];

      // ── Regret matching for opponent strategy ──
      const oppStrat = new Array(numOA);
      posSum = 0;
      for (let a = 0; a < numOA; a++) {
        oppStrat[a] = Math.max(oppRegrets[a], 0);
        posSum += oppStrat[a];
      }
      if (posSum > 1e-9) {
        for (let a = 0; a < numOA; a++) oppStrat[a] /= posSum;
      } else {
        for (let a = 0; a < numOA; a++) oppStrat[a] = 1 / numOA;
      }
      for (let a = 0; a < numOA; a++) oppStratSum[a] += oppStrat[a];

      // ── Counterfactual values for each hero action ──
      const heroVals = new Array(numHA);
      let heroEV = 0;
      const samples = 25;

      for (let a = 0; a < numHA; a++) {
        const act = heroActions[a];
        let val;

        if (act.type === 'fold') {
          val = 0;
        } else if (act.type === 'passive') {
          const finalPot = pot + act.amt;
          val = terminalEV([], finalPot, samples);
        } else {
          // Aggressive: opponent responds with strategy
          const betAmt = Math.min(
            Math.floor(pot * act.mult) + toCall,
            effStack
          );
          if (betAmt <= toCall) {
            val = terminalEV([], pot + toCall, samples);
          } else {
            const potAfterBet = pot + betAmt;
            const raiseAmt = Math.min(betAmt * 2, effStack);

            // Value of each opponent response (from hero's perspective)
            const oppNodeVals = new Array(numOA);
            oppNodeVals[0] = pot; // opp folds → hero wins current pot
            oppNodeVals[1] = terminalEV([], potAfterBet, samples); // opp calls
            oppNodeVals[2] = terminalEV([], pot + raiseAmt, samples); // opp raises

            // Hero's value = Σ oppStrat[o] * heroValue[o]
            val = 0;
            for (let o = 0; o < numOA; o++) {
              val += oppStrat[o] * oppNodeVals[o];
            }

            // Update opponent regrets
            let oppEV = 0;
            for (let o = 0; o < numOA; o++) {
              oppEV += oppStrat[o] * (-oppNodeVals[o]);
            }
            for (let o = 0; o < numOA; o++) {
              oppRegrets[o] += (-oppNodeVals[o] - oppEV) * heroStrat[a];
            }
          }
        }

        heroVals[a] = val;
        heroEV += heroStrat[a] * val;
      }

      // ── Update hero regrets ──
      for (let a = 0; a < numHA; a++) {
        heroRegrets[a] += heroVals[a] - heroEV;
      }

      // ── DCFR discounting ──
      const posDisc = Math.pow(t1 / (t1 + 1), 1.5);
      const negDisc = Math.pow(t1 / (t1 + 1), 2.0);
      for (let a = 0; a < numHA; a++) {
        heroRegrets[a] *= (heroRegrets[a] > 0) ? posDisc : negDisc;
      }
      for (let a = 0; a < numOA; a++) {
        oppRegrets[a] *= (oppRegrets[a] > 0) ? posDisc : negDisc;
      }
    }

    // ── Build final averaged strategy ──
    let totalSum = 0;
    for (let a = 0; a < numHA; a++) totalSum += heroStratSum[a];
    const finalStrat = new Array(numHA);
    for (let a = 0; a < numHA; a++) {
      finalStrat[a] = totalSum > 0 ? heroStratSum[a] / totalSum : 1 / numHA;
    }

    // ── Sample action from strategy ──
    const r = Math.random();
    let cum = 0;
    for (let a = 0; a < numHA; a++) {
      cum += finalStrat[a];
      if (r <= cum || a === numHA - 1) {
        const chosen = heroActions[a];
        if (chosen.type === 'fold') return { action: 'fold' };
        if (chosen.type === 'passive') {
          return toCall === 0 ? { action: 'check' } : { action: 'call' };
        }
        const betAmt = Math.round(Math.min(Math.floor(pot * chosen.mult) + toCall, effStack) / 10) * 10;
        if (betAmt >= effStack) return { action: 'allin' };
        if (betAmt <= toCall) return { action: 'call' };
        return { action: 'raise', amount: betAmt };
      }
    }

    return { action: toCall === 0 ? 'check' : 'fold' };
  }

  // Multi-opponent post-flop decision: EV-based with Monte Carlo equity
  getMultiOppPostFlopAction(player, numOpp, canRaise) {
    const toCall = this.currentBet - player.roundBet;
    const pot = this.pot;
    const effStack = player.chips;
    const equity = this.calcEquity(player, numOpp);

    // Normalize equity: multi-opp equity tends to be lower, adjust thresholds
    const adjEquity = equity + (Math.random() - 0.5) * 0.03;
    const potOdds = toCall > 0 ? toCall / (pot + toCall) : 0;
    const stackRatio = toCall > 0 ? toCall / (player.chips + toCall) : 0;

    if (toCall === 0) {
      if (adjEquity > 0.65 && canRaise) return this.makeRaise(player, 0.50 + Math.random() * 0.50);
      if (adjEquity > 0.48 && Math.random() < 0.50 && canRaise) return this.makeRaise(player, 0.25 + Math.random() * 0.30);
      if (adjEquity > 0.25 && Math.random() < 0.25 && canRaise) return this.makeRaise(player, 0.15 + Math.random() * 0.15);
      return { action: 'check' };
    }

    if (!canRaise) {
      return adjEquity > potOdds - 0.03 ? { action: 'call' } : { action: 'fold' };
    }

    if (adjEquity > 0.62 && canRaise) return this.makeRaise(player, 0.50 + Math.random() * 0.50);
    if (adjEquity > potOdds + 0.04 && canRaise && Math.random() < 0.30) return this.makeRaise(player, 0.30 + Math.random() * 0.30);
    if (adjEquity > potOdds + 0.02) return { action: 'call' };
    if (stackRatio < 0.10 && adjEquity > potOdds - 0.02) return { action: 'call' };
    if (adjEquity > 0.15 && stackRatio < 0.05) return { action: 'call' };
    return { action: 'fold' };
  }

  // ── Main AI Decision Engine (EV-based, with DCFR for post-flop) ──
  getAIAction(player) {
    const toCall = this.currentBet - player.roundBet;
    const numOpp = Math.min(this.countPlayersInHand() - 1, 4);
    const canRaise = !player.hasActedThisRound || this.canReRaise || toCall === 0;

    // Use DCFR solver for post-flop heads-up decisions
    if (this.communityCards.length >= 3) {
      if (numOpp <= 1) {
        return this.dcfrGetAction(player, numOpp, canRaise);
      }
      return this.getMultiOppPostFlopAction(player, numOpp, canRaise);
    }

    // Pre-flop / early street: use EV-based logic
    let equity = this.calcEquity(player, numOpp);
    equity += (Math.random() - 0.5) * 0.04;
    equity = Math.max(0.03, Math.min(0.97, equity));

    if (toCall === 0) {
      if (equity > 0.75) return this.makeRaise(player, 0.70 + Math.random() * 0.50);
      if (equity > 0.58) return this.makeRaise(player, 0.35 + Math.random() * 0.40);
      if (equity > 0.38 && Math.random() < 0.40) return this.makeRaise(player, 0.20 + Math.random() * 0.25);
      return { action: 'check' };
    }

    // Cannot re-raise after under-raise — only fold or call
    if (!canRaise) {
      const potAfterCall = this.pot + toCall;
      const potOdds = toCall / potAfterCall;
      return equity > potOdds - 0.02 ? { action: 'call' } : { action: 'fold' };
    }

    const potAfterCall = this.pot + toCall;
    const potOdds = toCall / potAfterCall;
    const stackRatio = toCall / (player.chips + toCall);

    if (equity > 0.72) {
      const pf = equity > 0.84 ? 0.65 + Math.random() * 0.55 : 0.40 + Math.random() * 0.40;
      return this.makeRaise(player, pf);
    }
    if (equity > potOdds + 0.05) {
      if (equity > 0.55 && Math.random() < 0.20) return this.makeRaise(player, 0.30 + Math.random() * 0.30);
      return { action: 'call' };
    }
    if (equity > potOdds - 0.02 && stackRatio < 0.12) return { action: 'call' };
    if (stackRatio < 0.06 && equity > 0.18) return { action: 'call' };
    return { action: 'fold' };
  }

  // ── Showdown ──
  showdown() {
    // Recalculate side pots based on total contributions
    this.calculateSidePots();

    const results = [];

    // Determine reveal order: last aggressor first, then clockwise
    const revealOrder = [];
    const startIdx = this.lastAggressorIdx >= 0
      ? this.players.findIndex(p => p.seatIndex === this.lastAggressorIdx && !p.folded)
      : -1;
    if (startIdx >= 0) {
      for (let i = 0; i < this.players.length; i++) {
        const p = this.players[(startIdx + i) % this.players.length];
        if (!p.folded) revealOrder.push(p);
      }
    } else {
      // No aggressor (everyone checked): first active left of dealer
      for (let i = 0; i < this.players.length; i++) {
        const p = this.players[(this.dealerIdx + 1 + i) % this.players.length];
        if (!p.folded) revealOrder.push(p);
      }
    }

    for (const player of revealOrder) {
      const allCards = [...player.holeCards, ...this.communityCards];
      const hand = evaluate7Hand(allCards);
      results.push({ player, hand });
      this.addLog(`${player.name}: ${hand.name}`, 'action-info');
    }

    results.sort((a, b) => compareResults(b.hand, a.hand));

    // Group winners
    const winners = [results[0].player];
    for (let i = 1; i < results.length; i++) {
      if (compareResults(results[0].hand, results[i].hand) === 0) {
        winners.push(results[i].player);
      } else {
        break;
      }
    }

    // Distribute pots
    this.distributePots(results);

    // Log results
    const bestHand = results[0].hand;
    this.addLog(t('log.wins', winners.map(w => w.name).join(', '), bestHand.name), 'winner');

    return { winners, results, bestHand };
  }

  calculateSidePots() {
    // Include ALL players (even folded) for contribution amounts — folded money is still in pot
    const allByContrib = this.players
      .map((p, i) => ({ idx: i, contributed: p.totalBetThisHand }))
      .filter(x => x.contributed > 0)
      .sort((a, b) => a.contributed - b.contributed);

    const checkers = this.players
      .map((p, i) => ({ idx: i, contributed: p.totalBetThisHand }))
      .filter(x => !this.players[x.idx].folded && x.contributed === 0)
      .map(x => x.idx);

    this.sidePots = [];
    let prevLevel = 0;

    for (const entry of allByContrib) {
      const level = entry.contributed;
      const increment = level - prevLevel;
      if (increment > 0) {
        // Count ALL players (including folded) for pot amount
        const atLevel = allByContrib.filter(e => e.contributed >= level);
        const potAmount = increment * atLevel.length;
        // Only non-folded players are eligible to win
        const eligible = atLevel.filter(e => !this.players[e.idx].folded).map(e => e.idx);
        if (this.sidePots.length === 0 && checkers.length > 0) {
          eligible.push(...checkers);
        }
        this.sidePots.push({ amount: potAmount, eligibleIndices: eligible });
        prevLevel = level;
      }
    }
  }

  distributePots(results) {
    const resultMap = {};
    for (const r of results) {
      resultMap[r.player.seatIndex] = r;
    }

    let totalAwarded = 0;

    for (const sidePot of this.sidePots) {
      // Find best hand among eligible players
      let bestResult = null;
      const eligibleWinners = [];
      for (const idx of sidePot.eligibleIndices) {
        if (resultMap[idx] && this.players[idx] && !this.players[idx].folded) {
          const r = resultMap[idx];
          if (!bestResult || compareResults(r.hand, bestResult) > 0) {
            bestResult = r.hand;
            eligibleWinners.length = 0;
            eligibleWinners.push(idx);
          } else if (bestResult && compareResults(r.hand, bestResult) === 0) {
            eligibleWinners.push(idx);
          }
        }
      }

      if (eligibleWinners.length > 0) {
        const share = Math.floor(sidePot.amount / eligibleWinners.length);
        const remainder = sidePot.amount - share * eligibleWinners.length;
        for (let i = 0; i < eligibleWinners.length; i++) {
          const bonus = i < remainder ? 1 : 0;
          this.players[eligibleWinners[i]].chips += share + bonus;
        }
        totalAwarded += sidePot.amount;
      }
    }

    // If no side pots calculated, give all to winners
    if (this.sidePots.length === 0 && this.pot > 0) {
      const bestResult = results[0].hand;
      const topPlayers = results.filter(r => compareResults(r.hand, bestResult) === 0).map(r => r.player);
      const share = Math.floor(this.pot / topPlayers.length);
      const remainder = this.pot - share * topPlayers.length;
      for (let i = 0; i < topPlayers.length; i++) {
        topPlayers[i].chips += share + (i < remainder ? 1 : 0);
      }
      totalAwarded += this.pot;
    }

    // Any unclaimed chips (partial or none) — distribute among active non-folded players
    if (totalAwarded < this.pot) {
      const active = results.filter(r => !r.player.folded);
      if (active.length > 0) {
        const unclaimed = this.pot - totalAwarded;
        const share = Math.floor(unclaimed / active.length);
        const remainder = unclaimed - share * active.length;
        for (let i = 0; i < active.length; i++) {
          active[i].player.chips += share + (i < remainder ? 1 : 0);
        }
      }
    }
  }

  // ── Full Game Flow ──
  async playHand() {
    if (this.busy) return;
    this.busy = true;
    try {
    this.startNewHand();
    this.render();
    this.addLog(t('log.handStart', this.handNumber), 'phase-change');

    await this.delay(300);

    // Pre-flop betting
    this.addLog(t('log.preFlopBetting'), 'phase-change');
    await this.runBettingRound();
    if (this.countPlayersInHand() <= 1) return this.endHandEarly();

    const streets = [['FLOP','log.flop',3],['TURN','log.turn',1],['RIVER','log.river',1]];
    for (const [phase, logKey, count] of streets) {
      this.phase = phase;
      this.dealCommunity(count);
      this.currentPlayerIdx = this.getFirstToActPostFlop();
      this.currentBet = 0;
      this.lastRaiseAmount = BB_AMOUNT;
      this.canReRaise = true;
      this.addLog(t(logKey), 'phase-change');
      this.render();
      await this.delay(400);
      await this.runBettingRound();
      if (this.countPlayersInHand() <= 1) return this.endHandEarly();
    }

    // Showdown
    this.phase = 'SHOWDOWN';
    this.render();
    await this.delay(500);

    const potBeforeDistribute = this.pot;
    const result = this.showdown();
    this.pot = 0;
    this.phase = 'GAME_OVER';
    this.render();
    this.showResultBanner(result);
    this.addLog(t('log.potDistributed', potBeforeDistribute), 'phase-change');
    } catch (e) {
      console.error('Game error:', e);
      const msg = (e && e.message) || String(e);
      this.addLog(t('log.gameError', msg), 'action-fold');
      this.addLog(t('log.refresh'), 'action-fold');
      this.phase = 'IDLE';
      this.render();
    } finally {
      this.busy = false;
    }
  }

  async endHandEarly() {
    let winner = this.players.find(p => !p.folded);
    if (!winner) winner = this.players.find(p => p.chips > 0);
    if (winner) {
      winner.chips += this.pot;
      this.addLog(t('log.winsPot', winner.name, this.pot), 'winner');
    }
    this.pot = 0;
    this.phase = 'GAME_OVER';
    this.render();
    this.showResultBanner({ winners: winner ? [winner] : [], bestHand: null, results: [], earlyWin: true });
  }

  // ── UI Helpers ──
  delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  addLog(msg, cssClass) {
    const logEl = this.els.logEntries;
    if (!logEl) return;
    const entry = document.createElement('div');
    entry.className = 'log-entry' + (cssClass ? ' ' + cssClass : '');
    entry.textContent = msg;
    logEl.insertBefore(entry, logEl.firstChild);
    while (logEl.children.length > 100) {
      logEl.removeChild(logEl.lastChild);
    }
  }

  showResultBanner(result) {
    const banner = this.els.resultBanner;
    const titleEl = this.els.resultTitle;
    const winnerEl = this.els.resultWinner;
    const handEl = this.els.resultHand;
    const potEl = this.els.resultPot;
    const cardsEl = this.els.resultCards;
    const playersEl = this.els.resultPlayers;

    if (result.earlyWin) {
      titleEl.textContent = t('ui.everyoneFolded');
      winnerEl.textContent = result.winners[0] ? t('ui.winsPot', result.winners[0].name) : '';
      handEl.textContent = '';
      cardsEl.innerHTML = '';
      playersEl.innerHTML = '';
    } else if (result.bestHand) {
      titleEl.textContent = t('ui.showdownResult');
      winnerEl.textContent = t('ui.wins', result.winners.map(w => w.name).join(', '));
      handEl.textContent = result.bestHand.name;

      // Community cards (table cards)
      let cardsHTML = '<div class="result-label">' + t('ui.communityCards') + '</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">';
      for (const c of this.communityCards) {
        cardsHTML += cardHTML(c, false, false);
      }
      cardsHTML += '</div>';

      // Best 5-card combination (winning hand)
      const bestCards = result.bestHand.cards || [];
      cardsHTML += '<div class="result-label">' + t('ui.bestHand') + '</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">';
      for (const c of bestCards) {
        cardsHTML += cardHTML(c, false, false);
      }
      cardsHTML += '</div>';
      cardsEl.innerHTML = cardsHTML;

      // All players at showdown
      const winnerSet = new Set(result.winners.map(w => w.seatIndex));
      let playersHTML = '<div class="result-label">' + t('ui.playerHands') + '</div>';

      // Show active (non-folded) players sorted by hand strength
      for (const r of result.results) {
        const isWinner = winnerSet.has(r.player.seatIndex);
        playersHTML += '<div class="player-row' + (isWinner ? ' winner-row' : '') + '">';
        playersHTML += `<span class="p-name">${isWinner ? '★ ' : ''}${r.player.name}</span>`;
        playersHTML += '<span class="p-cards">';
        playersHTML += r.player.holeCards.map(c => cardHTML(c, false, true)).join('');
        playersHTML += '</span>';
        playersHTML += `<span class="p-hand">${r.hand.name}</span>`;
        playersHTML += '</div>';
      }

      // Show folded players
      for (const p of this.players) {
        if (p.folded) {
          playersHTML += '<div class="player-row">';
          playersHTML += `<span class="p-name">${p.name}</span>`;
          playersHTML += '<span class="p-cards">';
          playersHTML += p.holeCards.map(c => cardHTML(c, false, true)).join('');
          playersHTML += '</span>';
          playersHTML += '<span class="p-folded">' + t('ui.folded') + '</span>';
          playersHTML += '</div>';
        }
      }

      playersEl.innerHTML = playersHTML;
    } else {
      titleEl.textContent = t('ui.gameOverTitle');
      winnerEl.textContent = '';
      handEl.textContent = '';
      cardsEl.innerHTML = '';
      playersEl.innerHTML = '';
    }

    potEl.innerHTML = t('ui.pot') + this.pot;

    // Show human player's balance
    const human = this.players[0];
    if (human) {
      const balEl = document.createElement('div');
      balEl.className = 'result-balance';
      balEl.textContent = t('ui.yourBalance') + ' $' + human.chips;
      potEl.appendChild(balEl);
    }

    banner.classList.remove('hidden');

    this.els.btnNextHand.onclick = () => {
      banner.classList.add('hidden');
      this.checkGameOver();
    };
  }

  checkGameOver() {
    const playersWithChips = this.players.filter(p => p.chips > 0);
    const human = this.players[0];
    const humanBusted = human && human.chips === 0;

    if (playersWithChips.length <= 1 || humanBusted) {
      this.phase = 'IDLE';
      this.render();
      if (humanBusted) {
        this.addLog(t('log.busted'), 'action-fold');
      }
      this.addLog(playersWithChips.length === 1
        ? t('log.winsGame', playersWithChips[0].name)
        : t('log.gameOver'), 'winner');
      this.els.controls.classList.add('hidden');
      this.els.phaseBadge.textContent = t('phase.gameOver');
      this.els.setupOverlay.classList.remove('hidden');
      const nextBtn = this.els.btnNextHand;
      nextBtn.setAttribute('data-i18n', 'btn.newGame');
      nextBtn.textContent = t('btn.newGame');
    } else {
      this.playHand();
    }
  }

  // ── Render ──
  render() {
    try {
      this.renderPhase();
      this.renderCommunityCards();
      this.renderSeats();
      this.renderControls();
      this.renderPot();
    } catch (e) {
      console.error('Render error:', e);
    }
  }

  renderPhase() {
    this.els.phaseBadge.textContent = t(PHASE_KEYS[this.phase] || 'phase.waiting');
    this.els.handCounter.textContent = this.handNumber > 0 ? t('ui.hand', this.handNumber) : '';
  }

  renderCommunityCards() {
    const container = this.els.communityCards;
    container.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const slot = document.createElement('div');
      slot.className = 'card-slot';
      if (i < this.communityCards.length) {
        slot.classList.add('filled');
        slot.innerHTML = cardHTML(this.communityCards[i]);
      }
      container.appendChild(slot);
    }
  }

  renderPot() {
    this.els.potAmount.textContent = this.pot;
  }

  renderSeats() {
    const container = this.els.seatsContainer;
    const n = this.players.length;
    if (n === 0) { container.innerHTML = ''; return; }

    // Check if player count changed — if so, full rebuild needed for positions
    const seatCount = container.querySelectorAll('.seat').length;
    if (seatCount !== n || !this._seatPositions) { container.innerHTML = ''; }

    if (container.innerHTML === '') {
      // Full position rebuild
      this._seatPositions = [];
      const tableEl = this.els.tableArea;
      const tableW = tableEl.offsetWidth || tableEl.parentElement.offsetWidth || 800;
      const tableH = tableEl.offsetHeight || tableEl.parentElement.offsetHeight || 500;
      const cx = tableW / 2;
      const cy = tableH / 2;
      // Reduce vertical radius to keep seats from overlapping header/controls.
      // Seat height ≈ 70px; reserve 45px padding on top and bottom edges.
      const vPadding = 45;
      const maxRy = (tableH / 2) - vPadding;
      const rawRy = tableH * (0.38 * (0.95 + n * 0.02));
      const rx = tableW * (0.40 * (0.95 + n * 0.02));
      const ry = Math.min(rawRy, maxRy);

      for (let i = 0; i < n; i++) {
        const angle = (Math.PI / 2) - i * (2 * Math.PI / n);
        const x = cx + rx * Math.cos(angle);
        const y = cy - ry * Math.sin(angle);

        const seat = document.createElement('div');
        seat.className = 'seat';
        seat.dataset.idx = i;
        seat.style.left = x + 'px';
        seat.style.top = y + 'px';
        seat.innerHTML = '<div class="seat-inner"><div class="player-name"></div><div class="hole-cards"></div><div class="chip-count"></div></div>';
        container.appendChild(seat);
        this._seatPositions.push({ x, y });
      }
    }

    // Build blind info
    const sbIdx = n === 2 ? this.dealerIdx : this.nextActiveSeat(this.dealerIdx);
    const bbIdx = this.nextActiveSeat(sbIdx);
    const showBlind = this.handNumber > 0 && this.phase !== 'IDLE';

    // Update each seat content in place
    const seats = container.querySelectorAll('.seat');
    for (let i = 0; i < n; i++) {
      const seat = seats[i];
      const player = this.players[i];

      // Class names
      const needsYou = player.isHuman;
      const needsFolded = player.folded;
      const needsActive = (i === this.currentPlayerIdx && this.phase !== 'IDLE' && this.phase !== 'GAME_OVER' && !player.folded);

      if (seat.classList.contains('you') !== needsYou) seat.classList.toggle('you', needsYou);
      if (seat.classList.contains('folded') !== needsFolded) seat.classList.toggle('folded', needsFolded);
      if (seat.classList.contains('active-turn') !== needsActive) seat.classList.toggle('active-turn', needsActive);

      const inner = seat.querySelector('.seat-inner');

      // Player name + blinds
      let blindHTML = '';
      if (showBlind) {
        if (i === this.dealerIdx) blindHTML += '<span class="dealer-chip">D</span>';
        if (i === sbIdx) blindHTML += '<span class="blind-tag sb">SB</span>';
        if (i === bbIdx) blindHTML += '<span class="blind-tag bb">BB</span>';
      }
      const nameEl = inner.querySelector('.player-name');
      const nameHTML = blindHTML + player.name;
      if (nameEl._lastHTML !== nameHTML) { nameEl.innerHTML = nameHTML; nameEl._lastHTML = nameHTML; }

      // Hole cards
      const shouldShow = player.isHuman || ((this.phase === 'SHOWDOWN' || this.phase === 'GAME_OVER') && !player.folded);
      const holeHTML = shouldShow
        ? player.holeCards.map(c => cardHTML(c, false, true)).join('')
        : '<div class="card face-down mini"></div><div class="card face-down mini"></div>';
      const cardsEl = inner.querySelector('.hole-cards');
      if (cardsEl._lastHTML !== holeHTML) { cardsEl.innerHTML = holeHTML; cardsEl._lastHTML = holeHTML; }

      // Chips
      const chipsEl = inner.querySelector('.chip-count');
      const chipsText = '$' + player.chips;
      if (chipsEl._lastText !== chipsText) { chipsEl.textContent = chipsText; chipsEl._lastText = chipsText; }

      // Status tag + bet
      let extraHTML = '';
      if (player.folded) {
        extraHTML = '<span class="status-tag folded-tag">' + t('ui.folded') + '</span>';
      } else {
        if (player.allIn) extraHTML += '<span class="status-tag allin-tag">ALL-IN</span>';
        if (player.roundBet > 0) extraHTML += '<div class="bet-amount">' + t('ui.bet') + player.roundBet + '</div>';
      }
      // Remove old status/bet elements, append fresh
      const oldStatus = inner.querySelectorAll('.status-tag, .bet-amount');
      const oldStatusHTML = Array.from(oldStatus).map(el => el.outerHTML).join('');
      if (inner._lastExtra !== extraHTML) {
        oldStatus.forEach(el => el.remove());
        if (extraHTML) {
          const extraContainer = document.createElement('div');
          extraContainer.innerHTML = extraHTML;
          while (extraContainer.firstChild) inner.appendChild(extraContainer.firstChild);
        }
        inner._lastExtra = extraHTML;
      }
    }
  }

  updateAllText() {
    applyI18n();
    this.renderPhase();
    this.renderPot();
    if (this.players.length > 0) {
      this.renderControls();
    }
  }

  renderControls() {
    const controls = this.els.controls;
    const human = this.players[0];
    if (!human) { controls.classList.add('hidden'); return; }

    // Show your hand
    const handDisplay = this.els.yourHandDisplay;
    if (human.holeCards.length > 0 && !human.folded) {
      handDisplay.innerHTML = `
        <span class="your-hand-label">${t('ui.yourHand')}</span>
        ${human.holeCards.map(c => cardHTML(c, false, true)).join('')}
      `;
    } else {
      handDisplay.innerHTML = '';
    }

    // Show/hide controls based on whether it's human's turn
    const isHumanTurn = this.currentPlayerIdx === 0
      && !human.folded
      && !human.allIn
      && human.chips > 0
      && this.phase !== 'IDLE'
      && this.phase !== 'GAME_OVER'
      && this.phase !== 'SHOWDOWN';

    if (isHumanTurn) {
      controls.classList.remove('hidden');
      const toCall = this.currentBet - human.roundBet;

      this.els.btnFold.style.display = toCall > 0 ? '' : 'none';
      this.els.btnCheck.style.display = toCall === 0 ? '' : 'none';
      this.els.btnCall.style.display = toCall > 0 ? '' : 'none';
      this.els.btnFoldCallRow.style.display = toCall > 0 ? '' : 'none';
        const callSpan = this.els.btnCall.querySelector('span[data-i18n]');
      const callAmtSpan = this.els.btnCall.querySelector('.call-amount');
      if (toCall >= human.chips) {
        if (callSpan) callSpan.textContent = t('ui.allInBadge');
        if (callAmtSpan) callAmtSpan.textContent = '';
      } else {
        if (callSpan) callSpan.textContent = t('btn.call');
        if (callAmtSpan) callAmtSpan.textContent = ' $' + toCall;
      }

      // Raise slider — value represents TOTAL bet amount
      const canRaise = !human.hasActedThisRound || this.canReRaise || toCall === 0;
      if (canRaise) {
        const minRaise = Math.ceil((this.currentBet + Math.max(BB_AMOUNT, this.lastRaiseAmount)) / 10) * 10;
        const maxRaise = Math.floor((human.roundBet + human.chips) / 10) * 10;
        const slider = this.els.raiseSlider;
        if (minRaise > maxRaise) {
          slider.style.display = 'none';
          this.els.raiseAmount.textContent = '';
          this.els.btnRaise.style.display = 'none';
        } else {
          slider.style.display = '';
          slider.min = minRaise;
          slider.max = maxRaise;
          slider.value = Math.round(Math.max(minRaise, Math.min(human.roundBet + BB_AMOUNT * 2, maxRaise)) / 10) * 10;
          const raiseSize = parseInt(slider.value) - this.currentBet;
          this.els.raiseAmount.textContent = `+$${raiseSize} → $${slider.value}`;
          this.els.btnRaise.style.display = '';
        }
        this.els.btnAllin.style.display = human.chips > 0 ? '' : 'none';
      } else {
        this.els.raiseSlider.style.display = 'none';
        this.els.raiseAmount.textContent = '';
        this.els.btnRaise.style.display = 'none';
        this.els.btnAllin.style.display = 'none';
      }
    } else {
      controls.classList.add('hidden');
    }
  }
}

// ── Card HTML Helper ──
function cardHTML(card, faceDown, mini) {
  if (faceDown === undefined) faceDown = false;
  if (mini === undefined) mini = false;
  const sizeClass = mini ? 'mini' : '';
  if (faceDown) return `<div class="card face-down ${sizeClass}"></div>`;
  const colorClass = cardIsRed(card) ? 'red' : 'black';
  return `<div class="card ${sizeClass} ${colorClass}">
    <span class="card-rank">${card.name}</span>
    <span class="card-suit">${SUIT_SYMBOLS[card.suit]}</span>
  </div>`;
}

// ── Result banner drag ──
(function() {
  const banner = document.getElementById('result-banner');
  const handle = document.getElementById('result-drag-handle');
  let dragging = false, startX, startY, startLeft, startTop;

  function onStart(e) {
    if (e.target !== handle && !handle.contains(e.target)) return;
    dragging = true;
    const rect = banner.getBoundingClientRect();
    startLeft = rect.left;
    startTop = rect.top;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    startX = clientX;
    startY = clientY;
    banner.style.transform = 'none';
    banner.style.top = startTop + 'px';
    banner.style.left = startLeft + 'px';
    e.preventDefault();
  }

  function onMove(e) {
    if (!dragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    banner.style.top = (startTop + clientY - startY) + 'px';
    banner.style.left = (startLeft + clientX - startX) + 'px';
  }

  function onEnd() { dragging = false; }

  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
})();

// Initial render (empty table)
document.addEventListener('DOMContentLoaded', () => {
  // Placeholder game for initial render
  game = new PokerGame();
  game.players = [];
  game.render();

  // ── Resize handler: re-render seats when window size changes ──
  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      if (game && game.players.length > 0) {
        game.render();
      }
    }, 150);
  });

  // Also observe the table area for size changes (CSS-driven)
  if (window.ResizeObserver) {
    const tableEl = document.getElementById('table-area');
    const observer = new ResizeObserver(() => {
      if (game && game.players.length > 0) {
        game.render();
      }
    });
    observer.observe(tableEl);
  }

  // ── Mobile log toggle ──
  const logToggleMobile = document.getElementById('log-toggle-mobile');
  const gameLog = document.getElementById('game-log');
  if (logToggleMobile && gameLog) {
    logToggleMobile.addEventListener('click', () => {
      const collapsed = gameLog.classList.toggle('hidden');
      logToggleMobile.querySelector('.ico').textContent =
        collapsed ? 'article' : 'expand_less';
    });
  }

  // On mobile, collapse log by default
  const mq = window.matchMedia('(max-width: 800px)');
  function handleMobileLayout(e) {
    if (e.matches) {
      gameLog.classList.add('hidden');
      logToggleMobile.style.display = 'flex';
    } else {
      gameLog.classList.remove('hidden');
      logToggleMobile.style.display = 'none';
    }
  }
  mq.addEventListener('change', handleMobileLayout);
  if (mq.matches) {
    gameLog.classList.add('hidden');
    logToggleMobile.style.display = 'flex';
  }
});

// 3D Starfield Background (continuous ~30fps animation)
// ═══════════════════════════════════════════
(function() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let lastTime = 0;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', () => {
    resize();
    createStars();
    drawOnce(performance.now());
  });
  resize();

  // Star layers: { depth, speed, count, size, opacity }
  const layers = [
    { depth: 0, count: 120, speed: 0.03, minSize: 0.3, maxSize: 1.0, opacity: 0.6, twinkle: true },
    { depth: 1, count: 80,  speed: 0.06, minSize: 0.5, maxSize: 1.5, opacity: 0.75, twinkle: true },
    { depth: 2, count: 40,  speed: 0.12, minSize: 0.8, maxSize: 2.2, opacity: 0.9, twinkle: false },
  ];

  function createStars() {
    stars = [];
    for (const layer of layers) {
      for (let i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: layer.minSize + Math.random() * (layer.maxSize - layer.minSize),
          depth: layer.depth,
          speed: layer.speed,
          opacity: layer.opacity * (0.5 + Math.random() * 0.5),
          twinkle: layer.twinkle,
          twinklePhase: Math.random() * Math.PI * 2,
          twinkleSpeed: 0.01 + Math.random() * 0.03,
          hue: Math.random() < 0.15 ? 220 + Math.random() * 30 : Math.random() < 0.08 ? 40 + Math.random() * 15 : 0,
          saturation: Math.random() < 0.15 ? 30 : 0,
        });
      }
    }
  }
  createStars();

  function getBlackHoleCenter() {
    const tableEl = document.getElementById('table-area');
    if (!tableEl) return { cx: canvas.width * 0.5, cy: canvas.height * 0.5, r: 180 };
    const rect = tableEl.getBoundingClientRect();
    return {
      cx: rect.left + rect.width / 2,
      cy: rect.top + rect.height / 2,
      r: Math.min(rect.width, rect.height) / 2
    };
  }

  // Cache to avoid getBoundingClientRect() (forced reflow) every draw
  let cachedBH = null;
  function getBH() {
    if (!cachedBH) cachedBH = getBlackHoleCenter();
    return cachedBH;
  }
  // Recalculate on resize or after significant layout change
  window.addEventListener('resize', function() { cachedBH = null; });
  function drawOnce(time) {
    // Advance star positions based on elapsed time (clamp to avoid big jumps)
    const dt = lastTime ? Math.min(time - lastTime, 200) : 16;
    lastTime = time;

    // Move stars (parallax scrolling)
    for (const s of stars) {
      s.y += s.speed * (dt / 16);
      if (s.y > canvas.height + 5) {
        s.y = -5;
        s.x = Math.random() * canvas.width;
      }
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const bh = getBH();

    // Gravitational lensing halo
    const haloGrad = ctx.createRadialGradient(bh.cx, bh.cy, bh.r * 0.88, bh.cx, bh.cy, bh.r * 1.35);
    haloGrad.addColorStop(0, 'transparent');
    haloGrad.addColorStop(0.25, 'rgba(120, 160, 230, 0.03)');
    haloGrad.addColorStop(0.45, 'rgba(140, 190, 255, 0.08)');
    haloGrad.addColorStop(0.60, 'rgba(120, 160, 230, 0.04)');
    haloGrad.addColorStop(0.80, 'rgba(60, 100, 180, 0.015)');
    haloGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = haloGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Einstein ring
    const erGrad = ctx.createRadialGradient(
      bh.cx - bh.r * 0.015, bh.cy - bh.r * 0.015, bh.r * 0.96,
      bh.cx, bh.cy, bh.r * 1.03
    );
    erGrad.addColorStop(0, 'transparent');
    erGrad.addColorStop(0.38, 'rgba(180, 215, 255, 0.08)');
    erGrad.addColorStop(0.48, 'rgba(210, 235, 255, 0.22)');
    erGrad.addColorStop(0.52, 'rgba(190, 225, 255, 0.18)');
    erGrad.addColorStop(0.62, 'rgba(140, 190, 240, 0.06)');
    erGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = erGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Nebula blobs
    const nebulaColors = [
      { x: canvas.width * 0.15, y: canvas.height * 0.2, r: 280, color: 'rgba(99, 102, 241, 0.025)' },
      { x: canvas.width * 0.85, y: canvas.height * 0.65, r: 240, color: 'rgba(139, 92, 246, 0.02)' },
      { x: canvas.width * 0.3, y: canvas.height * 0.85, r: 300, color: 'rgba(251, 191, 36, 0.012)' },
    ];
    for (const n of nebulaColors) {
      const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      grad.addColorStop(0, n.color);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Stars with gravitational lensing
    for (const s of stars) {
      const dx = s.x - bh.cx;
      const dy = s.y - bh.cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let sx = s.x, sy = s.y;
      const photonSphere = bh.r * 0.88;
      if (dist < bh.r * 2.2 && dist > photonSphere) {
        const impact = (dist - photonSphere) / bh.r;
        const deflection = 1 + (0.25 / Math.max(impact * impact, 0.005));
        const factor = Math.min(deflection, 2.0);
        sx = bh.cx + dx * factor;
        sy = bh.cy + dy * factor;
      }

      let alpha = s.opacity;
      if (s.twinkle) {
        alpha *= 0.6 + 0.4 * Math.sin(s.twinklePhase + time * s.twinkleSpeed * 0.001);
      }
      if (dist < bh.r * 0.78) {
        alpha = 0;
      } else if (dist < bh.r * 0.88) {
        alpha *= Math.max(0, (dist - bh.r * 0.74) / (bh.r * 0.14));
      }

      const hsl = s.hue > 0
        ? `hsla(${s.hue}, ${s.saturation}%, 90%, ${alpha})`
        : `rgba(255, 255, 255, ${alpha})`;

      ctx.fillStyle = hsl;
      ctx.beginPath();
      ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      ctx.fill();

      if (s.r > 1.2 && dist > bh.r * 0.80) {
        const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, s.r * 3);
        glow.addColorStop(0, hsl);
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sx, sy, s.r * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Expose globally so game logic can trigger redraws
  let lastDrawTime = 0;
  function scheduleDraw(t) {
    if (t - lastDrawTime > 33) {
      lastDrawTime = t;
      drawOnce(t);
    }
  }

  // Continuous animation loop (~30fps)
  function animateLoop() {
    scheduleDraw(performance.now());
    requestAnimationFrame(animateLoop);
  }
  requestAnimationFrame(animateLoop);

  // Event-driven redraws for responsive interaction
  ['click', 'touchstart', 'scroll', 'mousemove'].forEach(function(evt) {
    document.addEventListener(evt, function() { lastDrawTime = 0; scheduleDraw(performance.now()); }, { passive: true });
  });

  // Initial draw
  drawOnce(performance.now());
})();
</script>

</body>
</html>
